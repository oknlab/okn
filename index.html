<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OKNLAB — Intelligent Architecture</title>
  <link rel="icon" href="https://avatars.githubusercontent.com/u/32960623?s=52&v=2">

  <!-- Fonts -->
  <link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@800,500,700,400,300&display=swap" rel="stylesheet" />
  <!-- Shared styles -->
  <link rel="stylesheet" href="styles.css" />

  <!-- Tailwind + config -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { bg: '#080806', surface: '#111110', text: '#E4E2DA', accent: '#C4953F' },
          fontFamily: { sans: ['Cabinet Grotesk', 'sans-serif'] },
        }
      }
    }
  </script>

  <!-- React -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

  <!-- Shared utilities (plain JS) -->
  <script src="app.js"></script>
</head>
<body class="overflow-x-hidden">
  <div id="root"></div>

  <script type="text/babel">
    const { useLayoutEffect, useRef } = React;
    gsap.registerPlugin(ScrollTrigger);

    /* ── Icons ── */
    const IconArrowRight = () => (
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <line x1="5" y1="12" x2="19" y2="12" /><polyline points="12 5 19 12 12 19" />
      </svg>
    );
    const IconGithub = () => (
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22" />
      </svg>
    );

    /* ── Nav ── */
    const Nav = () => (
      <nav className="fixed top-6 left-0 right-0 z-50 flex justify-center w-full px-6 pointer-events-none">
        <div className="flex items-center justify-between w-full max-w-5xl px-6 py-3 rounded-full bg-surface/80 backdrop-blur-xl border border-white/10 pointer-events-auto shadow-2xl shadow-black" style={{backgroundColor:'rgba(17,17,16,0.85)'}}>
          <a href="index.html" className="text-lg font-bold tracking-widest uppercase hover:text-accent transition-colors" style={{color:'#E4E2DA'}}>OKNLAB</a>
          <div className="hidden md:flex items-center gap-8 text-sm font-medium" style={{color:'rgba(228,226,218,0.6)'}}>
            <a href="index.html" data-nav-link="index.html" className="hover:text-white transition-colors font-bold" style={{color:'#E4E2DA'}}>Projects</a>
            <a href="contact.html" data-nav-link="contact.html" className="hover:text-white transition-colors">Contact</a>
          </div>
          <a href="contact.html" className="px-5 py-2 text-sm font-bold bg-white rounded-full hover:scale-105 transition-transform duration-300" style={{color:'#080806'}}>
            Let's Talk
          </a>
        </div>
      </nav>
    );

    /* ── Footer ── */
    const Footer = () => (
      <footer className="w-full border-t border-white/5 py-12 px-6" style={{backgroundColor:'#050504'}}>
        <div className="max-w-7xl mx-auto flex flex-col">
          <div className="flex flex-col md:flex-row justify-between items-center gap-8">
            <div className="flex items-center gap-4 text-sm font-bold uppercase tracking-widest" style={{color:'rgba(228,226,218,0.5)'}}>
              <span>© 2026 OKNLAB</span>
              <span className="w-1.5 h-1.5 rounded-full" style={{backgroundColor:'rgba(196,149,63,0.5)'}}></span>
              <span>San Francisco</span>
            </div>
            <div className="flex items-center gap-6 text-sm font-bold" style={{color:'rgba(228,226,218,0.5)'}}>
              <a href="privacy-policy.html" className="hover:text-white transition-colors">Privacy</a>
              <a href="terms.html" className="hover:text-white transition-colors">Terms</a>
              <a href="refund-policy.html" className="hover:text-white transition-colors">Refund</a>
              <a href="contact.html" className="hover:text-white transition-colors">Contact</a>
            </div>
          </div>
        </div>
      </footer>
    );

    /* ── Marquee ── */
    const InfiniteMarquee = () => (
      <div className="w-full overflow-hidden py-8 border-y border-white/5" style={{backgroundColor:'#0a0a08'}}>
        <div className="flex w-max items-center space-x-16 px-8 animate-marquee">
          {[...Array(2)].map((_, i) => (
            <React.Fragment key={i}>
              <span className="text-2xl md:text-4xl font-bold uppercase tracking-widest" style={{color:'rgba(228,226,218,0.1)'}}>CodeSynthesizer</span>
              <span className="w-3 h-3 rounded-full" style={{backgroundColor:'rgba(196,149,63,0.2)'}}></span>
              <span className="text-2xl md:text-4xl font-bold uppercase tracking-widest" style={{color:'rgba(228,226,218,0.1)'}}>DocuGen AI</span>
              <span className="w-3 h-3 rounded-full" style={{backgroundColor:'rgba(196,149,63,0.2)'}}></span>
              <span className="text-2xl md:text-4xl font-bold uppercase tracking-widest" style={{color:'rgba(228,226,218,0.1)'}}>FlowAutomate</span>
              <span className="w-3 h-3 rounded-full" style={{backgroundColor:'rgba(196,149,63,0.2)'}}></span>
              <span className="text-2xl md:text-4xl font-bold uppercase tracking-widest" style={{color:'rgba(228,226,218,0.1)'}}>VisionCraft</span>
              <span className="w-3 h-3 rounded-full" style={{backgroundColor:'rgba(196,149,63,0.2)'}}></span>
              <span className="text-2xl md:text-4xl font-bold uppercase tracking-widest" style={{color:'rgba(228,226,218,0.1)'}}>SecureGuard</span>
              <span className="w-3 h-3 rounded-full" style={{backgroundColor:'rgba(196,149,63,0.2)'}}></span>
            </React.Fragment>
          ))}
        </div>
      </div>
    );

    /* ── Home Page ── */
    const Home = () => {
      const containerRef = useRef(null);

      useLayoutEffect(() => {
        const ctx = gsap.context(() => {
          gsap.utils.toArray('.gsap-fade-up').forEach((el) => {
            gsap.fromTo(el,
              { opacity: 0, y: 40 },
              { opacity: 1, y: 0, duration: 1, ease: 'power3.out', scrollTrigger: { trigger: el, start: 'top 85%' } }
            );
          });
          gsap.utils.toArray('.gsap-scale-fade').forEach((card) => {
            gsap.fromTo(card,
              { scale: 0.9, opacity: 0.3 },
              { scale: 1, opacity: 1, duration: 1, scrollTrigger: { trigger: card, start: 'top 90%', end: 'top 50%', scrub: 1 } }
            );
          });
        }, containerRef);
        return () => ctx.revert();
      }, []);

      return (
        <div ref={containerRef} className="w-full flex flex-col items-center">

          {/* Hero */}
          <section className="relative w-full min-h-[95vh] flex flex-col items-center justify-center px-6 pt-32 pb-24">
            <div className="absolute inset-0" style={{background:'radial-gradient(ellipse at top, rgba(196,149,63,0.08), transparent 50%)'}}></div>
            <div className="z-10 flex flex-col items-center text-center max-w-6xl mx-auto w-full">
              <h1 className="font-bold leading-tight tracking-tight mb-10 w-full gsap-fade-up" style={{fontSize:'clamp(2.5rem,5vw,6rem)',lineHeight:'1.05',color:'#fff'}}>
                We architect intelligent
                <span className="inline-block align-middle rounded-full overflow-hidden border border-white/10 shadow-2xl mx-3 lg:mx-5" style={{width:'14vw',maxWidth:'200px',height:'clamp(2rem,4.5vw,4.5rem)',backgroundColor:'#111110',boxShadow:'0 0 40px rgba(196,149,63,0.1)'}}>
                  <img src="https://picsum.photos/seed/ai/800/400" className="w-full h-full object-cover" style={{filter:'grayscale(1)',mixBlendMode:'luminosity',opacity:'0.9',transition:'transform 1s'}} alt="AI core"
                    onMouseEnter={e => e.target.style.transform='scale(1.1)'}
                    onMouseLeave={e => e.target.style.transform='scale(1)'}
                  />
                </span>
                products that automate the complex and scale seamlessly.
              </h1>
              <div className="flex flex-col sm:flex-row items-center gap-6 mt-4 gsap-fade-up">
                <a href="#projects" className="px-8 py-4 font-bold rounded-full flex items-center gap-3 hover:scale-105 transition-transform duration-300" style={{backgroundColor:'#E4E2DA',color:'#080806'}}>
                  Explore Projects <IconArrowRight />
                </a>
                <a href="https://github.com/oknlab" target="_blank" rel="noopener noreferrer" className="px-8 py-4 font-bold rounded-full flex items-center gap-3 transition-colors duration-300" style={{backgroundColor:'#111110',border:'1px solid rgba(228,226,218,0.1)',color:'#E4E2DA'}}
                  onMouseEnter={e => e.currentTarget.style.backgroundColor='rgba(228,226,218,0.05)'}
                  onMouseLeave={e => e.currentTarget.style.backgroundColor='#111110'}
                >
                  <IconGithub /> GitHub
                </a>
              </div>
            </div>
          </section>

          <InfiniteMarquee />

          {/* Portfolio */}
          <section id="projects" className="w-full max-w-7xl mx-auto px-6 py-32 md:py-48">
            <div className="mb-16 gsap-fade-up">
              <h2 className="text-4xl md:text-6xl font-bold tracking-tight">Portfolio</h2>
              <p className="text-xl mt-4 max-w-2xl" style={{color:'rgba(228,226,218,0.5)'}}>High-density engineering for modern automation.</p>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-3 gap-4" style={{gridAutoRows:'300px'}}>

              {/* Card 1 — 2×2 */}
              <div className="group relative overflow-hidden rounded-3xl md:col-span-2 md:row-span-2 p-10 flex flex-col justify-end gsap-fade-up" style={{backgroundColor:'#111110',border:'1px solid rgba(228,226,218,0.1)'}}>
                <img src="https://picsum.photos/seed/terminal/1200/800" className="absolute inset-0 w-full h-full object-cover" style={{filter:'grayscale(1)',mixBlendMode:'luminosity',opacity:'0.3',transition:'transform 0.7s ease-out, opacity 0.7s ease-out'}} alt="CodeSynth"
                  onMouseEnter={e => { e.target.style.transform='scale(1.05)'; e.target.style.opacity='0.4'; }}
                  onMouseLeave={e => { e.target.style.transform='scale(1)'; e.target.style.opacity='0.3'; }}
                />
                <div className="absolute inset-0" style={{background:'linear-gradient(to top, #080806, rgba(8,8,6,0.8), transparent)'}}></div>
                <div className="relative z-10">
                  <span className="px-3 py-1 text-xs font-bold uppercase tracking-wider rounded-md mb-4 inline-block" style={{backgroundColor:'#E4E2DA',color:'#080806'}}>New</span>
                  <h3 className="text-3xl md:text-5xl font-bold mb-4">CodeSynthesizer X</h3>
                  <p className="md:text-lg max-w-md" style={{color:'rgba(228,226,218,0.6)'}}>Transformer-based architecture trained on production codebases to predict entire logic blocks.</p>
                </div>
              </div>

              {/* Card 2 */}
              <div className="group relative overflow-hidden rounded-3xl md:col-span-1 md:row-span-1 p-8 flex flex-col justify-between gsap-fade-up" style={{backgroundColor:'#111110',border:'1px solid rgba(228,226,218,0.1)'}}>
                <div className="w-12 h-12 rounded-xl flex items-center justify-center transition-transform duration-500 group-hover:scale-110" style={{backgroundColor:'rgba(228,226,218,0.05)',border:'1px solid rgba(228,226,218,0.1)'}}>
                  <span className="font-serif italic text-2xl" style={{color:'rgba(228,226,218,0.4)'}}>D</span>
                </div>
                <div>
                  <h3 className="text-2xl font-bold mb-2">DocuGen AI</h3>
                  <p className="text-sm" style={{color:'rgba(228,226,218,0.5)'}}>Automated technical documentation generation directly from your codebase.</p>
                </div>
              </div>

              {/* Card 3 */}
              <div className="group relative overflow-hidden rounded-3xl md:col-span-1 md:row-span-1 p-8 flex flex-col justify-between gsap-fade-up" style={{backgroundColor:'#111110',border:'1px solid rgba(228,226,218,0.1)'}}>
                <div className="w-12 h-12 rounded-xl flex items-center justify-center transition-transform duration-500 group-hover:scale-110" style={{backgroundColor:'rgba(228,226,218,0.05)',border:'1px solid rgba(228,226,218,0.1)'}}>
                  <span className="font-serif italic text-2xl" style={{color:'rgba(228,226,218,0.4)'}}>F</span>
                </div>
                <div>
                  <h3 className="text-2xl font-bold mb-2">FlowAutomate</h3>
                  <p className="text-sm" style={{color:'rgba(228,226,218,0.5)'}}>Visual workflow builder for connecting complex API endpoints without glue code.</p>
                </div>
              </div>

              {/* Card 4 */}
              <div className="group relative overflow-hidden rounded-3xl md:col-span-1 md:row-span-1 p-8 flex flex-col justify-between gsap-fade-up" style={{backgroundColor:'#111110',border:'1px solid rgba(228,226,218,0.1)'}}>
                <div className="w-12 h-12 rounded-xl flex items-center justify-center transition-transform duration-500 group-hover:scale-110" style={{backgroundColor:'rgba(228,226,218,0.05)',border:'1px solid rgba(228,226,218,0.1)'}}>
                  <span className="font-serif italic text-2xl" style={{color:'rgba(228,226,218,0.4)'}}>V</span>
                </div>
                <div>
                  <h3 className="text-2xl font-bold mb-2">VisionCraft API</h3>
                  <p className="text-sm" style={{color:'rgba(228,226,218,0.5)'}}>Enterprise image manipulation processing millions of assets at scale.</p>
                </div>
              </div>

              {/* Card 5 — 2×1 */}
              <div className="group relative overflow-hidden rounded-3xl md:col-span-2 md:row-span-1 p-8 flex flex-col justify-end gsap-fade-up" style={{backgroundColor:'#111110',border:'1px solid rgba(228,226,218,0.1)'}}>
                <img src="https://picsum.photos/seed/security/1000/400" className="absolute inset-0 w-full h-full object-cover" style={{filter:'grayscale(1)',mixBlendMode:'luminosity',opacity:'0.2',transition:'transform 0.7s ease-out, opacity 0.7s ease-out'}} alt="SecureGuard"
                  onMouseEnter={e => { e.target.style.transform='scale(1.05)'; e.target.style.opacity='0.3'; }}
                  onMouseLeave={e => { e.target.style.transform='scale(1)'; e.target.style.opacity='0.2'; }}
                />
                <div className="absolute inset-0" style={{background:'linear-gradient(to right, #080806, rgba(8,8,6,0.9), transparent)'}}></div>
                <div className="relative z-10 max-w-lg">
                  <h3 className="text-3xl font-bold mb-2">SecureGuard</h3>
                  <p style={{color:'rgba(228,226,218,0.6)'}}>AI-powered vulnerability scanner with real-time detection and automated patch suggestions for SOC2 compliance.</p>
                </div>
              </div>

            </div>
          </section>
        </div>
      );
    };

    /* ── App Shell ── */
    const App = () => (
      <main className="overflow-x-hidden w-full max-w-full relative">
        <div className="grain-overlay"></div>
        <Nav />
        <Home />
        <Footer />
      </main>
    );

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
