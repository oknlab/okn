<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OKNLAB — Intelligent Architecture</title>
  <link rel="icon" href="https://avatars.githubusercontent.com/u/32960623?s=52&v=2">

  <!-- Fonts -->
  <link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@800,500,700,400,300&display=swap" rel="stylesheet" />
  <!-- Shared styles -->
  <link rel="stylesheet" href="styles.css" />

  <!-- Tailwind + config -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { bg: '#080806', surface: '#111110', text: '#E4E2DA', accent: '#C4953F' },
          fontFamily: { sans: ['Cabinet Grotesk', 'sans-serif'] },
        }
      }
    }
  </script>

  <!-- React -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

  <!-- Shared utilities (plain JS) -->
  <script src="app.js"></script>

  <style>
    /* ── Carousel ── */
    .carousel-track {
      display: flex;
      gap: 20px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      cursor: grab;
      padding-bottom: 4px;
    }
    .carousel-track::-webkit-scrollbar { display: none; }
    .carousel-track.is-dragging { cursor: grabbing; user-select: none; }

    .project-card {
      flex: 0 0 clamp(300px, 38vw, 420px);
      scroll-snap-align: start;
      background: #111110;
      border: 1px solid rgba(228,226,218,0.08);
      border-radius: 28px;
      padding: 40px 36px 36px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 420px;
      position: relative;
      overflow: hidden;
      transition: border-color 0.4s ease, transform 0.4s ease;
    }
    .project-card:hover {
      border-color: rgba(228,226,218,0.18);
      transform: translateY(-4px);
    }

    /* Logo mark */
    .card-logo {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 40px;
      position: relative;
      flex-shrink: 0;
    }
    .card-logo-glyph {
      font-family: 'Cabinet Grotesk', sans-serif;
      font-weight: 800;
      font-size: 28px;
      line-height: 1;
      letter-spacing: -0.02em;
    }

    /* Card link */
    .card-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 100px;
      font-size: 13px;
      font-weight: 700;
      font-family: 'Cabinet Grotesk', sans-serif;
      letter-spacing: 0.02em;
      border: 1px solid rgba(228,226,218,0.12);
      background: transparent;
      color: rgba(228,226,218,0.7);
      text-decoration: none;
      transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease;
      width: fit-content;
    }
    .card-link:hover {
      background: rgba(228,226,218,0.06);
      color: #E4E2DA;
      border-color: rgba(228,226,218,0.25);
    }
    .card-link svg {
      width: 13px;
      height: 13px;
      opacity: 0.6;
      transition: transform 0.25s ease, opacity 0.25s ease;
    }
    .card-link:hover svg {
      transform: translate(2px, -2px);
      opacity: 1;
    }

    /* Carousel scroll hint dots */
    .carousel-dots {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .carousel-dot {
      width: 6px;
      height: 6px;
      border-radius: 100px;
      background: rgba(228,226,218,0.15);
      transition: width 0.3s ease, background 0.3s ease;
    }
    .carousel-dot.active {
      width: 20px;
      background: rgba(196,149,63,0.7);
    }

    /* Scroll progress bar */
    .scroll-progress-bar {
      height: 1px;
      background: rgba(228,226,218,0.05);
      border-radius: 100px;
      overflow: hidden;
      margin-top: 32px;
    }
    .scroll-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #C4953F, rgba(228,226,218,0.3));
      border-radius: 100px;
      width: 20%;
      transition: width 0.1s linear;
    }

    /* Card no. label */
    .card-number {
      position: absolute;
      top: 36px;
      right: 36px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: rgba(228,226,218,0.15);
      font-family: 'Cabinet Grotesk', sans-serif;
    }

    /* Featured card — slight accent border */
    .project-card.featured {
      border-color: rgba(196,149,63,0.2);
    }
    .project-card.featured:hover {
      border-color: rgba(196,149,63,0.35);
    }

    @keyframes marquee {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }
    .animate-marquee { animation: marquee 30s linear infinite; }
    .animate-marquee:hover { animation-play-state: paused; }

    .grain-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      pointer-events: none;
      opacity: 0.03;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    }
  </style>
</head>
<body class="overflow-x-hidden" style="background:#080806;color:#E4E2DA;">
  <div id="root"></div>

  <script type="text/babel">
    const { useLayoutEffect, useEffect, useRef, useState } = React;
    gsap.registerPlugin(ScrollTrigger);

    /* ── Icons ── */
    const IconArrowRight = () => (
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <line x1="5" y1="12" x2="19" y2="12" /><polyline points="12 5 19 12 12 19" />
      </svg>
    );
    const IconGithub = () => (
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22" />
      </svg>
    );
    const IconExternal = () => (
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
        <polyline points="15 3 21 3 21 9" />
        <line x1="10" y1="14" x2="21" y2="3" />
      </svg>
    );
    const IconBook = () => (
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
      </svg>
    );

    /* ── Nav ── */
    const Nav = () => (
      <nav className="fixed top-6 left-0 right-0 z-50 flex justify-center w-full px-6 pointer-events-none">
        <div className="flex items-center justify-between w-full max-w-5xl px-6 py-3 rounded-full pointer-events-auto shadow-2xl shadow-black" style={{backgroundColor:'rgba(17,17,16,0.85)',backdropFilter:'blur(20px)',WebkitBackdropFilter:'blur(20px)',border:'1px solid rgba(255,255,255,0.07)'}}>
          <a href="index.html" className="text-lg font-bold tracking-widest uppercase hover:text-accent transition-colors" style={{color:'#E4E2DA'}}>OKNLAB</a>
          <div className="hidden md:flex items-center gap-8 text-sm font-medium" style={{color:'rgba(228,226,218,0.6)'}}>
            <a href="index.html" className="hover:text-white transition-colors font-bold" style={{color:'#E4E2DA'}}>Projects</a>
            <a href="contact.html" className="hover:text-white transition-colors">Contact</a>
          </div>
          <a href="contact.html" className="px-5 py-2 text-sm font-bold bg-white rounded-full hover:scale-105 transition-transform duration-300" style={{color:'#080806'}}>
            Let's Talk
          </a>
        </div>
      </nav>
    );

    /* ── Footer ── */
    const Footer = () => (
      <footer className="w-full border-t py-12 px-6" style={{backgroundColor:'#050504',borderColor:'rgba(255,255,255,0.04)'}}>
        <div className="max-w-7xl mx-auto">
          <div className="flex flex-col md:flex-row justify-between items-center gap-8">
            <div className="flex items-center gap-4 text-sm font-bold uppercase tracking-widest" style={{color:'rgba(228,226,218,0.4)'}}>
              <span>© 2026 OKNLAB</span>
              <span className="w-1.5 h-1.5 rounded-full" style={{backgroundColor:'rgba(196,149,63,0.4)'}}></span>
              <span>San Francisco</span>
            </div>
            <div className="flex items-center gap-6 text-sm font-bold" style={{color:'rgba(228,226,218,0.4)'}}>
              <a href="privacy-policy.html" className="hover:text-white transition-colors">Privacy</a>
              <a href="terms-of-service.html" className="hover:text-white transition-colors">Terms</a>
              <a href="refund-policy.html" className="hover:text-white transition-colors">Refund</a>
              <a href="contact.html" className="hover:text-white transition-colors">Contact</a>
            </div>
          </div>
        </div>
      </footer>
    );

    /* ── Marquee ── */
    const InfiniteMarquee = () => (
      <div className="w-full overflow-hidden py-8 border-y" style={{backgroundColor:'#0a0a08',borderColor:'rgba(255,255,255,0.04)'}}>
        <div className="flex w-max items-center space-x-16 px-8 animate-marquee">
          {[...Array(2)].map((_, i) => (
            <React.Fragment key={i}>
              {['CodeSynthesizer','DocuGen AI','FlowAutomate','VisionCraft','SecureGuard'].map((name, j) => (
                <React.Fragment key={j}>
                  <span className="text-2xl md:text-4xl font-bold uppercase tracking-widest" style={{color:'rgba(228,226,218,0.07)'}}>{name}</span>
                  <span className="w-3 h-3 rounded-full" style={{backgroundColor:'rgba(196,149,63,0.15)'}}></span>
                </React.Fragment>
              ))}
            </React.Fragment>
          ))}
        </div>
      </div>
    );

    /* ── Project Data ── */
    const projects = [
      {
        id: '01',
        name: 'CodeSynthesizer X',
        tagline: 'AI Code Prediction Engine',
        description: 'Transformer-based architecture trained on production codebases to predict entire logic blocks, reducing boilerplate by 70% and accelerating feature velocity.',
        link: { label: 'Live Demo', href: '#', type: 'demo' },
        logo: { glyph: 'CS', bg: 'rgba(196,149,63,0.1)', border: 'rgba(196,149,63,0.2)', color: '#C4953F' },
        featured: true,
      },
      {
        id: '02',
        name: 'DocuGen AI',
        tagline: 'Documentation Automation',
        description: 'Automated technical documentation generation directly from your codebase. Keeps docs in sync with every commit — no more stale READMEs.',
        link: { label: 'GitHub', href: 'https://github.com/oknlab', type: 'github' },
        logo: { glyph: 'DG', bg: 'rgba(228,226,218,0.05)', border: 'rgba(228,226,218,0.1)', color: 'rgba(228,226,218,0.5)' },
        featured: false,
      },
      {
        id: '03',
        name: 'FlowAutomate',
        tagline: 'Visual Workflow Builder',
        description: 'Connect complex API endpoints without glue code. A visual canvas for orchestrating multi-step automations with conditional branching and retry logic.',
        link: { label: 'Case Study', href: '#', type: 'case' },
        logo: { glyph: 'FA', bg: 'rgba(59,130,246,0.08)', border: 'rgba(59,130,246,0.15)', color: 'rgba(120,170,255,0.8)' },
        featured: false,
      },
      {
        id: '04',
        name: 'VisionCraft API',
        tagline: 'Enterprise Image Processing',
        description: 'Processes millions of assets at scale — intelligent cropping, format conversion, and real-time CDN delivery with sub-100ms transformation latency.',
        link: { label: 'Live Demo', href: '#', type: 'demo' },
        logo: { glyph: 'VC', bg: 'rgba(16,185,129,0.07)', border: 'rgba(16,185,129,0.15)', color: 'rgba(100,210,170,0.8)' },
        featured: false,
      },
      {
        id: '05',
        name: 'SecureGuard',
        tagline: 'AI Vulnerability Scanner',
        description: 'AI-powered scanner with real-time detection and automated patch suggestions. Purpose-built for SOC2 compliance teams who ship fast.',
        link: { label: 'Case Study', href: '#', type: 'case' },
        logo: { glyph: 'SG', bg: 'rgba(239,68,68,0.07)', border: 'rgba(239,68,68,0.15)', color: 'rgba(255,130,130,0.8)' },
        featured: false,
      },
    ];

    /* ── Carousel ── */
    const ProjectCarousel = () => {
      const trackRef = useRef(null);
      const progressRef = useRef(null);
      const [activeIdx, setActiveIdx] = useState(0);
      const dragState = useRef({ isDown: false, startX: 0, scrollLeft: 0 });

      const updateProgress = () => {
        const el = trackRef.current;
        if (!el || !progressRef.current) return;
        const pct = el.scrollLeft / (el.scrollWidth - el.clientWidth);
        const fillW = 20 + pct * 80;
        progressRef.current.style.width = fillW + '%';
        const cardW = el.scrollWidth / projects.length;
        const idx = Math.round(el.scrollLeft / cardW);
        setActiveIdx(Math.min(idx, projects.length - 1));
      };

      useEffect(() => {
        const el = trackRef.current;
        if (!el) return;
        el.addEventListener('scroll', updateProgress, { passive: true });
        return () => el.removeEventListener('scroll', updateProgress);
      }, []);

      /* Drag to scroll */
      const onMouseDown = (e) => {
        const el = trackRef.current;
        dragState.current = { isDown: true, startX: e.pageX - el.offsetLeft, scrollLeft: el.scrollLeft };
        el.classList.add('is-dragging');
      };
      const onMouseUp = () => {
        trackRef.current?.classList.remove('is-dragging');
        dragState.current.isDown = false;
      };
      const onMouseMove = (e) => {
        if (!dragState.current.isDown) return;
        e.preventDefault();
        const el = trackRef.current;
        const x = e.pageX - el.offsetLeft;
        const walk = (x - dragState.current.startX) * 1.5;
        el.scrollLeft = dragState.current.scrollLeft - walk;
      };

      const linkIcon = (type) => {
        if (type === 'github') return <IconGithub />;
        if (type === 'case')   return <IconBook />;
        return <IconExternal />;
      };

      return (
        <div>
          {/* Track */}
          <div
            ref={trackRef}
            className="carousel-track"
            style={{paddingLeft:'0',paddingRight:'40px'}}
            onMouseDown={onMouseDown}
            onMouseLeave={onMouseUp}
            onMouseUp={onMouseUp}
            onMouseMove={onMouseMove}
          >
            {projects.map((p) => (
              <div key={p.id} className={`project-card${p.featured ? ' featured' : ''}`}>
                <span className="card-number">{p.id}</span>

                {/* Logo */}
                <div className="card-logo" style={{background: p.logo.bg, border: `1px solid ${p.logo.border}`}}>
                  <span className="card-logo-glyph" style={{color: p.logo.color}}>{p.logo.glyph}</span>
                </div>

                {/* Body */}
                <div style={{flex:1}}>
                  <p style={{fontSize:'11px',fontWeight:700,letterSpacing:'0.1em',color:'rgba(228,226,218,0.3)',textTransform:'uppercase',marginBottom:'10px',fontFamily:"'Cabinet Grotesk', sans-serif"}}>
                    {p.tagline}
                  </p>
                  <h3 style={{fontSize:'clamp(1.4rem,2.5vw,1.75rem)',fontWeight:800,letterSpacing:'-0.02em',lineHeight:1.1,color:'#E4E2DA',marginBottom:'16px',fontFamily:"'Cabinet Grotesk', sans-serif"}}>
                    {p.name}
                  </h3>
                  <p style={{fontSize:'14px',lineHeight:'1.65',color:'rgba(228,226,218,0.45)',fontFamily:"'Cabinet Grotesk', sans-serif"}}>
                    {p.description}
                  </p>
                </div>

                {/* Link */}
                <div style={{marginTop:'32px'}}>
                  <a
                    href={p.link.href}
                    className="card-link"
                    target={p.link.type === 'github' ? '_blank' : undefined}
                    rel={p.link.type === 'github' ? 'noopener noreferrer' : undefined}
                    onClick={e => e.stopPropagation()}
                  >
                    {linkIcon(p.link.type)}
                    {p.link.label}
                  </a>
                </div>
              </div>
            ))}
          </div>

          {/* Controls */}
          <div style={{marginTop:'28px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
            <div className="carousel-dots">
              {projects.map((_, i) => (
                <div
                  key={i}
                  className={`carousel-dot${i === activeIdx ? ' active' : ''}`}
                  style={{cursor:'pointer'}}
                  onClick={() => {
                    const el = trackRef.current;
                    const cardW = el.scrollWidth / projects.length;
                    el.scrollTo({ left: cardW * i, behavior: 'smooth' });
                  }}
                />
              ))}
            </div>
            <p style={{fontSize:'12px',fontWeight:600,letterSpacing:'0.06em',color:'rgba(228,226,218,0.2)',fontFamily:"'Cabinet Grotesk', sans-serif",textTransform:'uppercase'}}>
              Drag to explore
            </p>
          </div>

          {/* Progress bar */}
          <div className="scroll-progress-bar">
            <div ref={progressRef} className="scroll-progress-fill" />
          </div>
        </div>
      );
    };

    /* ── Home Page ── */
    const Home = () => {
      const containerRef = useRef(null);

      useLayoutEffect(() => {
        const ctx = gsap.context(() => {
          gsap.utils.toArray('.gsap-fade-up').forEach((el) => {
            gsap.fromTo(el,
              { opacity: 0, y: 40 },
              { opacity: 1, y: 0, duration: 1, ease: 'power3.out', scrollTrigger: { trigger: el, start: 'top 85%' } }
            );
          });
        }, containerRef);
        return () => ctx.revert();
      }, []);

      return (
        <div ref={containerRef} className="w-full flex flex-col items-center">

          {/* Hero */}
          <section className="relative w-full min-h-[95vh] flex flex-col items-center justify-center px-6 pt-32 pb-24">
            <div className="absolute inset-0" style={{background:'radial-gradient(ellipse at top, rgba(196,149,63,0.07), transparent 55%)'}}></div>
            <div className="z-10 flex flex-col items-center text-center max-w-6xl mx-auto w-full">
              <h1 className="font-bold leading-tight tracking-tight mb-10 w-full gsap-fade-up" style={{fontSize:'clamp(2.5rem,5vw,6rem)',lineHeight:'1.05',color:'#fff'}}>
                We architect intelligent
                <span className="inline-block align-middle rounded-full overflow-hidden border mx-3 lg:mx-5" style={{width:'14vw',maxWidth:'200px',height:'clamp(2rem,4.5vw,4.5rem)',backgroundColor:'#111110',border:'1px solid rgba(255,255,255,0.08)',boxShadow:'0 0 40px rgba(196,149,63,0.08)'}}>
                  <img src="https://picsum.photos/seed/ai/800/400" className="w-full h-full object-cover" style={{filter:'grayscale(1)',mixBlendMode:'luminosity',opacity:'0.9',transition:'transform 1s'}} alt="AI core"
                    onMouseEnter={e => e.target.style.transform='scale(1.1)'}
                    onMouseLeave={e => e.target.style.transform='scale(1)'}
                  />
                </span>
                products that automate the complex and scale seamlessly.
              </h1>
              <div className="flex flex-col sm:flex-row items-center gap-6 mt-4 gsap-fade-up">
                <a href="#projects" className="px-8 py-4 font-bold rounded-full flex items-center gap-3 hover:scale-105 transition-transform duration-300" style={{backgroundColor:'#E4E2DA',color:'#080806'}}>
                  Explore Projects <IconArrowRight />
                </a>
                <a href="https://github.com/oknlab" target="_blank" rel="noopener noreferrer" className="px-8 py-4 font-bold rounded-full flex items-center gap-3 transition-colors duration-300" style={{backgroundColor:'#111110',border:'1px solid rgba(228,226,218,0.1)',color:'#E4E2DA'}}
                  onMouseEnter={e => e.currentTarget.style.backgroundColor='rgba(228,226,218,0.05)'}
                  onMouseLeave={e => e.currentTarget.style.backgroundColor='#111110'}
                >
                  <IconGithub /> GitHub
                </a>
              </div>
            </div>
          </section>

          <InfiniteMarquee />

          {/* Portfolio */}
          <section id="projects" className="w-full mx-auto py-32 md:py-48">
            <div className="max-w-7xl mx-auto px-6 mb-14 gsap-fade-up" style={{display:'flex',alignItems:'flex-end',justifyContent:'space-between',flexWrap:'wrap',gap:'16px'}}>
              <div>
                <h2 style={{fontSize:'clamp(2.2rem,5vw,4.5rem)',fontWeight:800,letterSpacing:'-0.03em',lineHeight:1,color:'#E4E2DA',fontFamily:"'Cabinet Grotesk', sans-serif"}}>Portfolio</h2>
                <p style={{fontSize:'1.1rem',marginTop:'12px',color:'rgba(228,226,218,0.4)',fontFamily:"'Cabinet Grotesk', sans-serif"}}>
                  High-density engineering for modern automation.
                </p>
              </div>
              <span style={{fontSize:'13px',fontWeight:700,letterSpacing:'0.08em',color:'rgba(228,226,218,0.2)',textTransform:'uppercase',fontFamily:"'Cabinet Grotesk', sans-serif",paddingBottom:'6px'}}>
                {projects.length} Projects
              </span>
            </div>

            {/* Carousel — full bleed with left padding matching max-w container */}
            <div style={{paddingLeft:'max(24px, calc((100vw - 1280px) / 2 + 24px))'}}>
              <ProjectCarousel />
            </div>
          </section>

        </div>
      );
    };

    /* ── App Shell ── */
    const App = () => (
      <main className="overflow-x-hidden w-full max-w-full relative" style={{background:'#080806',color:'#E4E2DA'}}>
        <div className="grain-overlay"></div>
        <Nav />
        <Home />
        <Footer />
      </main>
    );

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
